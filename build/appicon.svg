<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Cortex app icon: abstract brain/circuit mark, built from overlapping
       filled circles (no complex hand-written bezier brain outline) plus a
       chip-style stem/pins and a simple node network on top, all in the
       app's existing accent color (#007ACC). Transparent background.
       See .specs/tasks/rename-to-cortex.md. -->
  <defs>
    <style>
      .lobe { fill: #007ACC; }
      .detail { stroke: #EAF6FF; stroke-width: 9; stroke-linecap: round; fill: none; }
      .node { fill: #EAF6FF; }
      .split { stroke: #00589c; stroke-width: 11; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- Left hemisphere -->
  <circle class="lobe" cx="330" cy="360" r="105"/>
  <circle class="lobe" cx="270" cy="460" r="95"/>
  <circle class="lobe" cx="300" cy="560" r="100"/>
  <circle class="lobe" cx="390" cy="610" r="85"/>
  <circle class="lobe" cx="430" cy="470" r="115"/>
  <circle class="lobe" cx="400" cy="330" r="85"/>

  <!-- Right hemisphere (mirrored across x=512) -->
  <circle class="lobe" cx="694" cy="360" r="105"/>
  <circle class="lobe" cx="754" cy="460" r="95"/>
  <circle class="lobe" cx="724" cy="560" r="100"/>
  <circle class="lobe" cx="634" cy="610" r="85"/>
  <circle class="lobe" cx="594" cy="470" r="115"/>
  <circle class="lobe" cx="624" cy="330" r="85"/>

  <!-- Chip stem + pins, bottom center -->
  <rect class="lobe" x="472" y="600" width="80" height="90" rx="18"/>
  <rect class="lobe" x="440" y="680" width="18" height="60" rx="8"/>
  <rect class="lobe" x="503" y="690" width="18" height="70" rx="8"/>
  <rect class="lobe" x="566" y="680" width="18" height="60" rx="8"/>

  <!-- Central fissure (splits the two hemispheres visually) -->
  <path class="split" d="M512,355 L512,560"/>

  <!-- Neural / circuit node network on top of the mass -->
  <path class="detail" d="M380,420 L460,500 L560,460 L650,430"/>
  <path class="detail" d="M460,500 L470,560"/>
  <circle class="node" cx="380" cy="420" r="15"/>
  <circle class="node" cx="460" cy="500" r="17"/>
  <circle class="node" cx="560" cy="460" r="15"/>
  <circle class="node" cx="650" cy="430" r="15"/>
  <circle class="node" cx="470" cy="560" r="13"/>
</svg>

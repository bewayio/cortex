name: Release

# Builds native macOS/Linux/Windows binaries on every push to main, invents
# a version number itself (BASE_VERSION below + this run's number — no
# manual tagging needed here), and publishes them as a new, permanently
# versioned GitHub Release + git tag on the public bewayio/homebrew-bcode
# repo (with a checksums.txt, sha256 per asset). It then updates that repo's
# Casks/bcode.rb (version + sha256) automatically — no manual cask edit
# needed after a release either. See .specs/modules/release.md.
#
# To bump the major/minor version, edit BASE_VERSION below — the patch
# number (this workflow's run number) always increases on its own.
#
# Requires a repo secret BCODE_RELEASE_TOKEN: a fine-grained GitHub PAT
# scoped to `contents:write` on bewayio/homebrew-bcode only. Create it under
# https://github.com/settings/tokens and add it under this repo's
# Settings > Secrets and variables > Actions. Not something this workflow
# (or the assistant that wrote it) creates on its own.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BASE_VERSION: "0.1"
  # Forces the public npm registry regardless of any org/account-level
  # override — hit a 403 from a private registry (npm.artifacts.furycloud.io)
  # neither this workflow nor the project's package.json/.npmrc reference,
  # so it must be coming from an org-wide Actions setting. This is a public
  # project; it has no business depending on a private internal proxy.
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux/amd64
            bin: bcode
            asset: bcode-linux-x86_64.AppImage
          - os: macos-latest
            platform: darwin/universal
            bin: bcode.app
            asset: bcode-macos-universal.zip
          - os: windows-latest
            platform: windows/amd64
            bin: bcode.exe
            asset: bcode-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Pinned to match go.mod's github.com/wailsapp/wails/v2 version —
      # a mismatched CLI/library pair is a common source of build failures.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # Same formula the publish job uses later to tag the release — computed
      # here too so the binary's own `bcode --version` matches the release
      # it ships in, without waiting on the publish job.
      - name: Compute version
        id: version
        shell: bash
        run: echo "value=${BASE_VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Wails v2.12.0's own webview bindings look up webkit2gtk-4.0 via
      # pkg-config specifically (hardcoded, not just an apt package name
      # choice) — Ubuntu 24.04 ("ubuntu-latest" as of 2026-09) dropped that
      # package for webkit2gtk-4.1, which pkg-config won't match under the
      # old name. Pinned this job to ubuntu-22.04 instead, which still has
      # libwebkit2gtk-4.0-dev, rather than working around Wails itself.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config imagemagick

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -clean -ldflags "-X main.Version=${{ steps.version.outputs.value }}"

      # The plain binary dynamically links libwebkit2gtk-4.0 and friends,
      # which most end-user systems don't have installed (confirmed by a
      # real user report, 2026-09-30: "error while loading shared
      # libraries: libwebkit2gtk-4.0.so.37"). linuxdeploy bundles the
      # binary's full shared-library closure (via ldd) into a self-
      # contained AppImage; the gtk plugin additionally bundles WebKitGTK's
      # own helper processes, GTK modules, GSettings schemas and locale
      # data, which a plain ldd-based bundle would miss. See
      # .specs/modules/release.md and .specs/tasks/linux-appimage-packaging.md.
      - name: Install linuxdeploy
        if: matrix.os == 'ubuntu-22.04'
        run: |
          wget -q -O linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-gtk https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p AppDir/usr/bin
          cp build/bin/${{ matrix.bin }} AppDir/usr/bin/
          cp build/linux/bcode.desktop AppDir/bcode.desktop

          # linuxdeploy only accepts a fixed list of icon resolutions;
          # build/appicon.png is 1024x1024 (not in that list), so resize
          # down to 512x512 (the largest valid size) for the AppImage icon.
          convert build/appicon.png -resize 512x512 AppDir/bcode.png

          # WebKitGTK spawns WebKitNetworkProcess/WebKitWebProcess as
          # separate helper binaries (libexec dir), not shared libraries —
          # linuxdeploy's ldd-based bundling (even with --plugin gtk) only
          # follows the main executable's *library* dependencies, so these
          # helper binaries are never copied in, and WebKitGTK falls back to
          # its compiled-in absolute system path at runtime (confirmed by a
          # real run, 2026-10-01: "Unable to spawn ... WebKitNetworkProcess
          # (Arquivo ou diretório inexistente)" — the exact system path from
          # the original webkit2gtk-4.0 bug this AppImage exists to avoid).
          # Fix: bundle that libexec dir by hand, and point WebKitGTK at the
          # bundled copy via WEBKIT_EXEC_PATH, set through linuxdeploy's
          # apprun-hooks mechanism (sourced by the generated AppRun before
          # exec'ing the real binary).
          WEBKIT_LIBEXEC_DIR=/usr/lib/x86_64-linux-gnu/webkit2gtk-4.0
          mkdir -p "AppDir$WEBKIT_LIBEXEC_DIR"
          cp -r "$WEBKIT_LIBEXEC_DIR"/. "AppDir$WEBKIT_LIBEXEC_DIR/"

          mkdir -p AppDir/apprun-hooks
          cat > AppDir/apprun-hooks/webkit-exec-path.sh <<'EOF'
          export WEBKIT_EXEC_PATH="$APPDIR/usr/lib/x86_64-linux-gnu/webkit2gtk-4.0"
          EOF

          # GitHub-hosted runners don't have a working FUSE, which
          # linuxdeploy (itself an AppImage) needs to mount itself unless
          # told to extract-and-run instead.
          export APPIMAGE_EXTRACT_AND_RUN=1
          export NO_STRIP=true
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir \
            --executable AppDir/usr/bin/${{ matrix.bin }} \
            --desktop-file AppDir/bcode.desktop \
            --icon-file AppDir/bcode.png \
            --plugin gtk \
            --output appimage

          # appimagetool names the output after the desktop file's Name=
          # entry (BCode) + arch — matched via glob instead of hardcoding
          # the exact casing, since that's an implementation detail of the
          # tool, not something this step should have to track by hand.
          mv ./*.AppImage ${{ matrix.asset }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: (cd build/bin && zip -r ../../${{ matrix.asset }} ${{ matrix.bin }})

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path build/bin/${{ matrix.bin }} -DestinationPath ${{ matrix.asset }}

      # One sha256 file per asset — the publish job bundles these into a
      # single checksums.txt, and the cask formula pins these exact values.
      - name: Checksum (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256

      - name: Checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: (Get-FileHash ${{ matrix.asset }} -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.asset }}" | Out-File -Encoding ascii ${{ matrix.asset }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine checksums
        run: cat artifacts/*.sha256 > artifacts/checksums.txt

      # No tag is pushed here in bewayio/code — the version is invented by
      # this workflow itself (BASE_VERSION + this run's own number, which
      # only ever increases), so every push to main gets its own permanent,
      # correctly versioned release without the user tagging anything.
      - name: Compute version
        id: version
        run: echo "value=${BASE_VERSION}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Versioned release (one per push), not a rolling "latest" — the
      # Homebrew cask needs a stable version + sha256 pair per release.
      # Cross-repo via owner/repo, so this needs BCODE_RELEASE_TOKEN (see
      # the note at the top of this file) instead of the default
      # GITHUB_TOKEN, which only has access to this repo.
      - name: Publish release to bewayio/homebrew-bcode
        uses: ncipollo/release-action@v1
        with:
          owner: bewayio
          repo: homebrew-bcode
          token: ${{ secrets.BCODE_RELEASE_TOKEN }}
          tag: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: >-
            Automated build from bewayio/code@${{ github.sha }}.
            Unsigned binaries — macOS Gatekeeper and Windows SmartScreen
            may warn on first launch.
          artifacts: artifacts/*

      # Keeps Casks/bcode.rb in sync automatically — no manual version/sha256
      # bump needed after each release. Same token as the publish step above,
      # since it already has contents:write on this repo.
      - name: Update Homebrew cask
        env:
          BCODE_RELEASE_TOKEN: ${{ secrets.BCODE_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          SHA256=$(grep "bcode-macos-universal.zip" artifacts/checksums.txt | awk '{print $1}')

          git clone "https://x-access-token:${BCODE_RELEASE_TOKEN}@github.com/bewayio/homebrew-bcode.git" tap
          cd tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/bcode.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/bcode.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/bcode.rb
          git commit -m "bcode ${VERSION}"
          git push
